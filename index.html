<!-- =========================================================
     FULL WEBSITE MOOD ENGINE
========================================================= -->

<style>

/* =========================================================
   FULL PAGE MOOD VARIABLES
========================================================= */

body{
    --mood-bg:#020604;
    --mood-card:rgba(5,15,10,.68);
    --mood-glow:rgba(54,242,155,.12);

    background:
        radial-gradient(
            circle at 75% 15%,
            var(--mood-glow),
            transparent 30%
        ),
        var(--mood-bg);

    transition:
        background 1.2s ease;
}


/* FULL PAGE CANVAS */

#fullMoodCanvas{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;

    z-index:-9;

    pointer-events:none;
}


/* ALL SITE CARDS FOLLOW MOOD */

.card,
.project,
.agency,
.stat,
.future,
.thesis{
    background:
        var(--mood-card);

    transition:
        background 1s ease,
        border-color 1s ease,
        box-shadow 1s ease;
}


/* =========================================================
   MOOD BUTTONS
========================================================= */

.moodbar{
    position:fixed;
    left:50%;
    bottom:14px;

    transform:translateX(-50%);

    z-index:1000;

    width:min(1100px,95%);

    display:flex;
    justify-content:center;
    flex-wrap:wrap;

    gap:7px;
}

.fullMoodBtn{
    border:1px solid rgba(255,255,255,.18);

    background:
        rgba(2,7,4,.80);

    color:white;

    padding:
        9px 12px;

    border-radius:
        13px;

    cursor:pointer;

    backdrop-filter:
        blur(16px);

    font-family:
        "Rajdhani",
        sans-serif;

    font-size:
        11px;

    transition:.3s;
}

.fullMoodBtn:hover{
    transform:
        translateY(-3px);

    border-color:
        var(--green);

    box-shadow:
        0 10px 30px
        rgba(54,242,155,.15);
}


/* =========================================================
   ACTIVE MOOD INDICATOR
========================================================= */

#moodName{

    position:fixed;

    top:92px;
    right:20px;

    z-index:999;

    padding:
        8px 13px;

    border-radius:
        999px;

    background:
        rgba(0,0,0,.28);

    border:
        1px solid
        rgba(255,255,255,.12);

    backdrop-filter:
        blur(14px);

    color:
        rgba(255,255,255,.72);

    font-family:
        "Rajdhani",
        sans-serif;

    font-size:
        11px;

    letter-spacing:
        2px;

    text-transform:
        uppercase;
}


/* =========================================================
   MOOD-SPECIFIC PAGE LOOK
========================================================= */


/* OCEAN */

body.mood-ocean{

    --mood-bg:
        linear-gradient(
            180deg,
            #062f46 0%,
            #064c65 45%,
            #02131d 100%
        );

    --mood-card:
        rgba(2,38,52,.66);

    --mood-glow:
        rgba(70,215,255,.18);

}


/* FOREST */

body.mood-forest{

    --mood-bg:
        linear-gradient(
            180deg,
            #061c12,
            #0c4328 48%,
            #03140c
        );

    --mood-card:
        rgba(5,38,23,.67);

    --mood-glow:
        rgba(70,255,150,.14);

}


/* DRAGON */

body.mood-dragon{

    --mood-bg:
        radial-gradient(
            circle at 70% 20%,
            #56150f,
            transparent 25%
        ),
        linear-gradient(
            145deg,
            #190102,
            #320708,
            #050000
        );

    --mood-card:
        rgba(46,5,7,.70);

    --mood-glow:
        rgba(255,75,30,.16);

}


/* GALAXY */

body.mood-galaxy{

    --mood-bg:
        radial-gradient(
            circle at 50% 50%,
            #13003c,
            #060012 45%,
            #000 80%
        );

    --mood-card:
        rgba(20,5,45,.68);

    --mood-glow:
        rgba(140,80,255,.16);

}


/* MOON */

body.mood-moon{

    --mood-bg:
        linear-gradient(
            160deg,
            #07153d,
            #020611 70%
        );

    --mood-card:
        rgba(7,19,51,.67);

    --mood-glow:
        rgba(130,175,255,.14);

}


/* NIGHT */

body.mood-night{

    --mood-bg:
        linear-gradient(
            180deg,
            #060c2c,
            #010307
        );

    --mood-card:
        rgba(6,12,36,.70);

    --mood-glow:
        rgba(80,130,255,.14);

}


/* DAY */

body.mood-day{

    --mood-bg:
        linear-gradient(
            180deg,
            #55bfe9,
            #dffaff 55%,
            #4e996b
        );

    --mood-card:
        rgba(220,245,248,.30);

    --mood-glow:
        rgba(255,240,160,.18);
}


/* SNOW */

body.mood-snow{

    --mood-bg:
        linear-gradient(
            180deg,
            #83cce9,
            #effaff 58%,
            #a9cad9
        );

    --mood-card:
        rgba(240,250,255,.30);

    --mood-glow:
        rgba(255,255,255,.22);
}


/* WALL */

body.mood-wall{

    --mood-bg:
        linear-gradient(
            120deg,
            #d69a94,
            #e9c6a5,
            #ccd8c3,
            #b6d9df,
            #c5b9db
        );

    --mood-card:
        rgba(255,255,255,.30);

    --mood-glow:
        rgba(255,210,150,.18);
}


/* =========================================================
   DARK/LIGHT MOOD TEXT FIX
========================================================= */

body.mood-day .section-title,
body.mood-wall .section-title,
body.mood-snow .section-title,
body.mood-day .card h3,
body.mood-wall .card h3,
body.mood-snow .card h3{
    color:#10221c;
}

body.mood-day .section-desc,
body.mood-wall .section-desc,
body.mood-snow .section-desc,
body.mood-day .card p,
body.mood-wall .card p,
body.mood-snow .card p{
    color:#28453a;
}

</style>


<canvas id="fullMoodCanvas"></canvas>

<div id="moodName">
    DEFAULT • ENGINEERING
</div>


<div class="moodbar">

    <button class="fullMoodBtn"
            onclick="setFullMood('default')">
        ✦ Default
    </button>

    <button class="fullMoodBtn"
            onclick="setFullMood('ocean')">
        🌊 Ocean
    </button>

    <button class="fullMoodBtn"
            onclick="setFullMood('forest')">
        🌲 Amazon Forest
    </button>

    <button class="fullMoodBtn"
            onclick="setFullMood('dragon')">
        🐉 Dragon
    </button>

    <button class="fullMoodBtn"
            onclick="setFullMood('galaxy')">
        🌌 Galaxy
    </button>

    <button class="fullMoodBtn"
            onclick="setFullMood('moon')">
        🌙 Moonlight
    </button>

    <button class="fullMoodBtn"
            onclick="setFullMood('night')">
        🌃 Night
    </button>

    <button class="fullMoodBtn"
            onclick="setFullMood('day')">
        ☀️ Day
    </button>

    <button class="fullMoodBtn"
            onclick="setFullMood('snow')">
        ❄️ Bangladesh Snow 🇧🇩
    </button>

    <button class="fullMoodBtn"
            onclick="setFullMood('wall')">
        🎨 Color Wall
    </button>

</div>


<script>

/* =========================================================
   FULL WEBSITE MOOD
========================================================= */

const moodCanvas =
    document.getElementById(
        "fullMoodCanvas"
    );

const moodCtx =
    moodCanvas.getContext("2d");

const moodName =
    document.getElementById(
        "moodName"
    );


let currentFullMood =
    "default";

let particles=[];

let t=0;


function resizeMood(){

    moodCanvas.width =
        innerWidth *
        devicePixelRatio;

    moodCanvas.height =
        innerHeight *
        devicePixelRatio;

    moodCanvas.style.width =
        innerWidth+"px";

    moodCanvas.style.height =
        innerHeight+"px";


    moodCtx.setTransform(
        devicePixelRatio,
        0,0,
        devicePixelRatio,
        0,0
    );
}

resizeMood();

addEventListener(
    "resize",
    resizeMood
);


/* =========================================================
   PARTICLES
========================================================= */

function createParticles(
    amount
){

    particles=[];

    for(
        let i=0;
        i<amount;
        i++
    ){

        particles.push({

            x:
                Math.random()
                *innerWidth,

            y:
                Math.random()
                *innerHeight,

            size:
                .5+
                Math.random()*3,

            speed:
                .5+
                Math.random()*2,

            alpha:
                .2+
                Math.random()*.7

        });

    }

}


/* =========================================================
   SET MOOD
========================================================= */

function setFullMood(
    mood
){

    currentFullMood =
        mood;


    document.body.classList.remove(
        "mood-ocean",
        "mood-forest",
        "mood-dragon",
        "mood-galaxy",
        "mood-moon",
        "mood-night",
        "mood-day",
        "mood-snow",
        "mood-wall"
    );


    if(
        mood!=="default"
    ){

        document.body.classList.add(
            "mood-"+mood
        );

    }


    const names={

        default:
            "DEFAULT • ENGINEERING",

        ocean:
            "LIVE OCEAN • ENGINEERING",

        forest:
            "LIVE AMAZON FOREST • ENGINEERING",

        dragon:
            "DRAGON REALM • ENGINEERING",

        galaxy:
            "GALAXY • BLACK HOLE • ENGINEERING",

        moon:
            "MOONLIGHT • ENGINEERING",

        night:
            "NIGHT CITY • ENGINEERING",

        day:
            "DAYLIGHT • ENGINEERING",

        snow:
            "WINTER BANGLADESH 🇧🇩",

        wall:
            "ARCHITECTURAL COLOR WALL"

    };


    moodName.textContent =
        names[mood];


    createParticles(
        mood==="galaxy" ||
        mood==="snow"
        ?350
        :180
    );


    localStorage.setItem(
        "portfolioMood",
        mood
    );

}


/* =========================================================
   LIVE BACKGROUND ENGINE
========================================================= */

function renderMood(){

    t+=.016;


    moodCtx.clearRect(
        0,
        0,
        innerWidth,
        innerHeight
    );


    /* OCEAN */

    if(
        currentFullMood==="ocean"
    ){

        for(
            let y=
                innerHeight*.55;
            y<
                innerHeight;
            y+=34
        ){

            moodCtx.beginPath();

            for(
                let x=0;
                x<=innerWidth;
                x+=15
            ){

                const wave=
                    y+
                    Math.sin(
                        x*.014+
                        t*1.8+
                        y*.01
                    )*5;


                moodCtx.lineTo(
                    x,
                    wave
                );

            }

            moodCtx.strokeStyle=
                "rgba(160,245,255,.12)";

            moodCtx.stroke();

        }

    }


    /* FOREST */

    else if(
        currentFullMood==="forest"
    ){

        for(
            let i=0;
            i<55;
            i++
        ){

            const x=
                (
                    i*137+
                    t*8
                )
                %innerWidth;

            const y=
                innerHeight*.25+
                (i%10)*
                55;

            const glow=
                .25+
                .25*
                Math.sin(
                    t*2+i
                );


            moodCtx.fillStyle=
                `rgba(160,255,180,${glow})`;

            moodCtx.shadowBlur=14;

            moodCtx.shadowColor=
                "#8cffab";

            moodCtx.beginPath();

            moodCtx.arc(
                x,
                y,
                2,
                0,
                Math.PI*2
            );

            moodCtx.fill();

            moodCtx.shadowBlur=0;

        }

    }


    /* DRAGON */

    else if(
        currentFullMood==="dragon"
    ){

        particles.forEach(
            p=>{

                p.y-=p.speed*1.7;

                p.x+=
                    Math.sin(
                        t+
                        p.y*.02
                    )*.6;


                if(
                    p.y<0
                ){

                    p.y=
                        innerHeight;

                }


                moodCtx.fillStyle=
                    `rgba(255,100,35,${p.alpha})`;

                moodCtx.beginPath();

                moodCtx.arc(
                    p.x,
                    p.y,
                    p.size,
                    0,
                    Math.PI*2
                );

                moodCtx.fill();

            }
        );

    }


    /* GALAXY */

    else if(
        currentFullMood==="galaxy"
    ){

        const cx=
            innerWidth/2;

        const cy=
            innerHeight/2;


        particles.forEach(
            p=>{

                const dx=
                    p.x-cx;

                const dy=
                    p.y-cy;


                p.x+=dx*.0003;
                p.y+=dy*.0003;


                moodCtx.fillStyle=
                    `rgba(190,225,255,${p.alpha})`;

                moodCtx.beginPath();

                moodCtx.arc(
                    p.x,
                    p.y,
                    p.size,
                    0,
                    Math.PI*2
                );

                moodCtx.fill();

            }
        );


        /* BLACK HOLE */

        const ring=
            moodCtx.createRadialGradient(
                cx,
                cy,
                0,
                cx,
                cy,
                230
            );

        ring.addColorStop(
            0,
            "rgba(0,0,0,1)"
        );

        ring.addColorStop(
            .25,
            "rgba(0,0,0,1)"
        );

        ring.addColorStop(
            .50,
            "rgba(160,70,255,.16)"
        );

        ring.addColorStop(
            .70,
            "rgba(255,130,40,.10)"
        );

        ring.addColorStop(
            1,
            "transparent"
        );


        moodCtx.fillStyle=
            ring;

        moodCtx.beginPath();

        moodCtx.arc(
            cx,
            cy,
            240,
            0,
            Math.PI*2
        );

        moodCtx.fill();

    }


    /* MOONLIGHT */

    else if(
        currentFullMood==="moon"
    ){

        const x=
            innerWidth*.78;

        const y=
            innerHeight*.18;


        moodCtx.shadowBlur=
            50;

        moodCtx.shadowColor=
            "rgba(235,245,255,.5)";

        moodCtx.fillStyle=
            "rgba(245,248,255,.75)";


        moodCtx.beginPath();

        moodCtx.arc(
            x,
            y,
            75,
            0,
            Math.PI*2
        );

        moodCtx.fill();

        moodCtx.shadowBlur=0;

    }


    /* NIGHT */

    else if(
        currentFullMood==="night"
    ){

        particles.forEach(
            p=>{

                p.x+=
                    p.speed;

                if(
                    p.x>
                    innerWidth
                ){

                    p.x=0;

                }


                moodCtx.fillStyle=
                    `rgba(255,220,110,${p.alpha})`;

                moodCtx.fillRect(
                    p.x,
                    p.y,
                    p.size+1,
                    p.size+1
                );

            }
        );

    }


    /* DAY */

    else if(
        currentFullMood==="day"
    ){

        for(
            let i=0;
            i<14;
            i++
        ){

            const x=
                (
                    i*170+
                    t*18
                )
                %(
                    innerWidth+250
                )-120;


            const y=
                100+
                i*22;


            moodCtx.fillStyle=
                "rgba(255,255,255,.075)";

            moodCtx.beginPath();

            moodCtx.arc(
                x,
                y,
                35,
                0,
                Math.PI*2
            );

            moodCtx.fill();

        }

    }


    /* SNOW */

    else if(
        currentFullMood==="snow"
    ){

        particles.forEach(
            p=>{

                p.y+=
                    p.speed*1.7;

                p.x+=
                    Math.sin(
                        t+
                        p.y*.01
                    )*.35;


                if(
                    p.y>
                    innerHeight
                ){

                    p.y=-5;

                }


                moodCtx.fillStyle=
                    `rgba(255,255,255,${p.alpha})`;


                moodCtx.beginPath();

                moodCtx.arc(
                    p.x,
                    p.y,
                    p.size,
                    0,
                    Math.PI*2
                );

                moodCtx.fill();

            }
        );

    }


    /* WALL */

    else if(
        currentFullMood==="wall"
    ){

        const g=
            moodCtx.createLinearGradient(
                0,
                0,
                innerWidth,
                innerHeight
            );


        g.addColorStop(
            0,
            `hsla(${(
                t*20
            )%360},70%,65%,.10)`
        );

        g.addColorStop(
            .5,
            `hsla(${(
                t*20+120
            )%360},70%,65%,.10)`
        );

        g.addColorStop(
            1,
            `hsla(${(
                t*20+240
            )%360},70%,65%,.10)`
        );


        moodCtx.fillStyle=g;

        moodCtx.fillRect(
            0,
            0,
            innerWidth,
            innerHeight
        );

    }


    requestAnimationFrame(
        renderMood
    );

}

renderMood();


/* =========================================================
   RESTORE LAST MOOD
========================================================= */

const savedMood=
    localStorage.getItem(
        "portfolioMood"
    );

if(
    savedMood
){

    setFullMood(
        savedMood
    );

}
else{

    setFullMood(
        "default"
    );

}

</script>
