<!-- =========================================================
     10X LIVE THEME ENGINE
     No external images required
========================================================= -->

<style>

#themeWorld{
  position:fixed;
  inset:0;
  z-index:9998;
  display:none;
  overflow:hidden;
  background:#020604;
}

#themeWorld.active{
  display:block;
}

#themeCanvas{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
}

.theme-ui{
  position:absolute;
  inset:0;
  z-index:5;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  text-align:center;
  pointer-events:none;
  padding:30px;
}

.theme-icon{
  font-size:70px;
  filter:drop-shadow(0 0 25px rgba(255,255,255,.45));
}

.theme-title{
  margin:10px 0;
  color:white;
  font-family:"Space Grotesk",Arial,sans-serif;
  font-size:clamp(42px,7vw,90px);
  line-height:1;
  text-shadow:0 8px 45px rgba(0,0,0,.75);
}

.theme-description{
  max-width:760px;
  color:rgba(255,255,255,.83);
  font-family:"Times New Roman",serif;
  font-size:17px;
  line-height:1.7;
}

.theme-close{
  pointer-events:auto;
  margin-top:25px;
  padding:12px 20px;
  border:1px solid rgba(255,255,255,.22);
  border-radius:999px;
  color:white;
  background:rgba(0,0,0,.32);
  backdrop-filter:blur(12px);
  cursor:pointer;
  font-family:"Space Grotesk",Arial,sans-serif;
}

.theme-close:hover{
  background:rgba(255,255,255,.12);
}

.theme-flag{
  position:absolute;
  top:30px;
  right:30px;
  font-size:42px;
  filter:drop-shadow(0 0 18px rgba(0,255,120,.45));
}

.theme-backdrop{
  position:absolute;
  inset:0;
  transition:background .8s ease;
}

@keyframes themeZoom{
  from{transform:scale(1);}
  to{transform:scale(1.09);}
}

@keyframes themeSpin{
  to{transform:rotate(360deg);}
}

@media(max-width:600px){

  .theme-icon{
    font-size:50px;
  }

  .theme-title{
    font-size:42px;
  }

  .theme-description{
    font-size:14px;
  }

  .theme-flag{
    top:20px;
    right:20px;
    font-size:30px;
  }

}

</style>

<!-- =========================================================
     LIVE THEME SCREEN
========================================================= -->

<div id="themeWorld">

  <div class="theme-backdrop" id="themeBackdrop"></div>

  <canvas id="themeCanvas"></canvas>

  <div class="theme-ui">

    <div class="theme-icon" id="themeIcon"></div>

    <div class="theme-title" id="themeTitle"></div>

    <div class="theme-description" id="themeDescription"></div>

    <button
      class="theme-close"
      onclick="closeLiveTheme()">
      ← Return to Portfolio
    </button>

  </div>

  <div class="theme-flag"
       id="themeFlag"
       style="display:none;">
    🇧🇩
  </div>

</div>


<script>

/* =========================================================
   LIVE THEME ENGINE
========================================================= */

const themeWorld =
  document.getElementById("themeWorld");

const themeCanvas =
  document.getElementById("themeCanvas");

const themeCtx =
  themeCanvas.getContext("2d");

const themeBackdrop =
  document.getElementById("themeBackdrop");

const themeIcon =
  document.getElementById("themeIcon");

const themeTitle =
  document.getElementById("themeTitle");

const themeDescription =
  document.getElementById("themeDescription");

const themeFlag =
  document.getElementById("themeFlag");


let activeTheme = "";

let animationId = null;

let objects = [];

let themeTime = 0;


/* =========================================================
   CANVAS SIZE
========================================================= */

function resizeThemeCanvas(){

  const dpr =
    Math.min(window.devicePixelRatio || 1,2);

  themeCanvas.width =
    window.innerWidth*dpr;

  themeCanvas.height =
    window.innerHeight*dpr;

  themeCanvas.style.width =
    window.innerWidth+"px";

  themeCanvas.style.height =
    window.innerHeight+"px";

  themeCtx.setTransform(
    dpr,
    0,
    0,
    dpr,
    0,
    0
  );

}

resizeThemeCanvas();

window.addEventListener(
  "resize",
  resizeThemeCanvas
);


/* =========================================================
   THEME DATA
========================================================= */

const themeData = {

  ocean:{
    icon:"🌊",
    title:"Ocean World",
    description:
      "A living ocean atmosphere — moving waves, deep water light and a calm horizon.",
    flag:false
  },

  forest:{
    icon:"🌲",
    title:"Amazon Forest",
    description:
      "A living green world with layered trees, mist, fireflies and drifting atmosphere.",
    flag:false
  },

  dragon:{
    icon:"🐉",
    title:"Dragon Realm",
    description:
      "A cinematic fantasy world filled with fire, smoke, mountains and a moving dragon silhouette.",
    flag:false
  },

  galaxy:{
    icon:"🌌",
    title:"Galaxy • Black Hole",
    description:
      "Deep space with stars, nebula clouds, orbiting energy and a gravitational black-hole core.",
    flag:false
  },

  moon:{
    icon:"🌙",
    title:"Moonlight",
    description:
      "A peaceful moonlit world with stars, clouds and soft blue night light.",
    flag:false
  },

  night:{
    icon:"🌃",
    title:"Night City",
    description:
      "A modern city atmosphere with moving lights, skyline silhouettes and a cinematic night sky.",
    flag:false
  },

  day:{
    icon:"☀️",
    title:"Daylight",
    description:
      "A fresh daylight environment with sun, clouds, landscape and moving atmosphere.",
    flag:false
  },

  snow:{
    icon:"❄️",
    title:"Winter Bangladesh",
    description:
      "A dreamlike winter landscape with live snowfall and the Bangladesh flag.",
    flag:true
  },

  wall:{
    icon:"🎨",
    title:"Architectural Color Wall",
    description:
      "A premium interior-wall atmosphere with slowly shifting magazine-style architectural colors.",
    flag:false
  }

};


/* =========================================================
   CREATE OBJECTS
========================================================= */

function createObjects(theme){

  objects=[];

  const w =
    window.innerWidth;

  const h =
    window.innerHeight;


  /* OCEAN */

  if(theme==="ocean"){

    for(
      let i=0;
      i<25;
      i++
    ){

      objects.push({

        type:"wave",

        y:
          h*.55+
          i*18,

        amp:
          4+Math.random()*10,

        speed:
          .7+Math.random()*1.2,

        phase:
          Math.random()*10

      });

    }

  }


  /* FOREST */

  if(theme==="forest"){

    for(
      let i=0;
      i<38;
      i++
    ){

      objects.push({

        type:"tree",

        x:
          Math.random()*w,

        y:
          h*.62+
          Math.random()*100,

        size:
          .45+
          Math.random()*.8,

        depth:
          Math.random()

      });

    }


    for(
      let i=0;
      i<55;
      i++
    ){

      objects.push({

        type:"firefly",

        x:
          Math.random()*w,

        y:
          h*.2+
          Math.random()*(h*.65),

        speed:
          .3+
          Math.random()*.8,

        phase:
          Math.random()*10

      });

    }

  }


  /* DRAGON */

  if(theme==="dragon"){

    for(
      let i=0;
      i<100;
      i++
    ){

      objects.push({

        type:"ember",

        x:
          Math.random()*w,

        y:
          h*.85+
          Math.random()*h*.15,

        speed:
          1+
          Math.random()*3,

        size:
          1+
          Math.random()*3

      });

    }

  }


  /* GALAXY */

  if(theme==="galaxy"){

    for(
      let i=0;
      i<500;
      i++
    ){

      const angle =
        Math.random()*
        Math.PI*2;

      const radius =
        30+
        Math.random()*
        Math.min(w,h)*.48;

      objects.push({

        type:"star",

        angle:angle,

        radius:radius,

        speed:
          .0002+
          Math.random()*.0007,

        size:
          .4+
          Math.random()*2,

        alpha:
          .2+
          Math.random()*.8

      });

    }

  }


  /* MOON */

  if(theme==="moon"){

    for(
      let i=0;
      i<80;
      i++
    ){

      objects.push({

        type:"moonStar",

        x:
          Math.random()*w,

        y:
          Math.random()*h*.65,

        size:
          .5+
          Math.random()*1.5,

        phase:
          Math.random()*10

      });

    }

  }


  /* NIGHT CITY */

  if(theme==="night"){

    for(
      let i=0;
      i<180;
      i++
    ){

      objects.push({

        type:"cityLight",

        x:
          Math.random()*w,

        y:
          h*.48+
          Math.random()*h*.42,

        size:
          1+
          Math.random()*3,

        speed:
          .2+
          Math.random()*1

      });

    }

  }


  /* DAY */

  if(theme==="day"){

    for(
      let i=0;
      i<22;
      i++
    ){

      objects.push({

        type:"cloud",

        x:
          Math.random()*w,

        y:
          70+
          Math.random()*h*.35,

        size:
          25+
          Math.random()*70,

        speed:
          .15+
          Math.random()*.4

      });

    }

  }


  /* SNOW */

  if(theme==="snow"){

    for(
      let i=0;
      i<500;
      i++
    ){

      objects.push({

        type:"snow",

        x:
          Math.random()*w,

        y:
          Math.random()*h,

        size:
          1+
          Math.random()*4,

        speed:
          .8+
          Math.random()*2,

        drift:
          Math.random()*.7

      });

    }

  }

}


/* =========================================================
   DRAW OCEAN
========================================================= */

function drawOcean(){

  const w =
    window.innerWidth;

  const h =
    window.innerHeight;


  const gradient =
    themeCtx.createLinearGradient(
      0,
      0,
      0,
      h
    );

  gradient.addColorStop(
    0,
    "#092f4a"
  );

  gradient.addColorStop(
    .45,
    "#063b57"
  );

  gradient.addColorStop(
    1,
    "#00131e"
  );

  themeCtx.fillStyle =
    gradient;

  themeCtx.fillRect(
    0,
    0,
    w,
    h
  );


  /* moon/sun reflection */

  themeCtx.fillStyle =
    "rgba(130,235,255,.13)";

  themeCtx.beginPath();

  themeCtx.arc(
    w*.72,
    h*.22,
    100,
    0,
    Math.PI*2
  );

  themeCtx.fill();


  /* horizon */

  themeCtx.fillStyle =
    "rgba(0,0,0,.32)";

  themeCtx.fillRect(
    0,
    h*.52,
    w,
    h*.48
  );


  objects.forEach(o=>{

    if(o.type!=="wave")
      return;

    themeCtx.beginPath();

    for(
      let x=0;
      x<=w;
      x+=12
    ){

      const y =
        o.y+
        Math.sin(
          x*.012+
          themeTime*
          o.speed+
          o.phase
        )*
        o.amp;

      themeCtx.lineTo(
        x,
        y
      );

    }

    themeCtx.strokeStyle =
      "rgba(150,235,255,.14)";

    themeCtx.lineWidth=
      1.2;

    themeCtx.stroke();

  });

}


/* =========================================================
   DRAW FOREST
========================================================= */

function drawForest(){

  const w =
    window.innerWidth;

  const h =
    window.innerHeight;


  const gradient =
    themeCtx.createLinearGradient(
      0,
      0,
      0,
      h
    );

  gradient.addColorStop(
    0,
    "#071d17"
  );

  gradient.addColorStop(
    .55,
    "#0b3826"
  );

  gradient.addColorStop(
    1,
    "#03150e"
  );

  themeCtx.fillStyle =
    gradient;

  themeCtx.fillRect(
    0,
    0,
    w,
    h
  );


  /* fog */

  const fog =
    themeCtx.createRadialGradient(
      w*.5,
      h*.55,
      30,
      w*.5,
      h*.55,
      500
    );

  fog.addColorStop(
    0,
    "rgba(220,255,235,.10)"
  );

  fog.addColorStop(
    1,
    "transparent"
  );

  themeCtx.fillStyle =
    fog;

  themeCtx.fillRect(
    0,
    0,
    w,
    h
  );


  /* trees */

  objects.forEach(o=>{

    if(o.type!=="tree")
      return;


    const s =
      o.size*100;

    const trunk =
      s*.12;


    themeCtx.fillStyle =
      "#3b281b";

    themeCtx.fillRect(
      o.x-trunk/2,
      o.y-s,
      trunk,
      s
    );


    themeCtx.fillStyle =
      o.depth>.5
      ? "#0b4f2c"
      : "#126b39";


    themeCtx.beginPath();

    themeCtx.arc(
      o.x,
      o.y-s*.82,
      s*.42,
      0,
      Math.PI*2
    );

    themeCtx.fill();


    themeCtx.beginPath();

    themeCtx.arc(
      o.x-s*.25,
      o.y-s*.65,
      s*.31,
      0,
      Math.PI*2
    );

    themeCtx.fill();


    themeCtx.beginPath();

    themeCtx.arc(
      o.x+s*.25,
      o.y-s*.63,
      s*.30,
      0,
      Math.PI*2
    );

    themeCtx.fill();

  });


  /* fireflies */

  objects.forEach(o=>{

    if(o.type!=="firefly")
      return;

    const glow =
      .5+
      .5*
      Math.sin(
        themeTime*o.speed+
        o.phase
      );

    themeCtx.fillStyle =
      `rgba(190,255,115,${glow})`;

    themeCtx.shadowBlur =
      18;

    themeCtx.shadowColor =
      "#aaff66";

    themeCtx.beginPath();

    themeCtx.arc(
      o.x,
      o.y+
        Math.sin(
          themeTime
        )*3,
      2,
      0,
      Math.PI*2
    );

    themeCtx.fill();

    themeCtx.shadowBlur=0;

  });

}


/* =========================================================
   DRAW DRAGON
========================================================= */

function drawDragon(){

  const w =
    window.innerWidth;

  const h =
    window.innerHeight;


  const gradient =
    themeCtx.createLinearGradient(
      0,
      0,
      0,
      h
    );

  gradient.addColorStop(
    0,
    "#080104"
  );

  gradient.addColorStop(
    .5,
    "#260708"
  );

  gradient.addColorStop(
    1,
    "#050000"
  );

  themeCtx.fillStyle =
    gradient;

  themeCtx.fillRect(
    0,
    0,
    w,
    h
  );


  /* red moon */

  themeCtx.fillStyle =
    "rgba(255,64,48,.18)";

  themeCtx.beginPath();

  themeCtx.arc(
    w*.74,
    h*.26,
    120,
    0,
    Math.PI*2
  );

  themeCtx.fill();


  /* mountains */

  themeCtx.fillStyle =
    "#100406";

  themeCtx.beginPath();

  themeCtx.moveTo(
    0,
    h*.82
  );

  themeCtx.lineTo(
    w*.20,
    h*.55
  );

  themeCtx.lineTo(
    w*.35,
    h*.78
  );

  themeCtx.lineTo(
    w*.55,
    h*.48
  );

  themeCtx.lineTo(
    w*.75,
    h*.76
  );

  themeCtx.lineTo(
    w*.90,
    h*.56
  );

  themeCtx.lineTo(
    w,
    h*.80
  );

  themeCtx.lineTo(
    w,
    h
  );

  themeCtx.lineTo(
    0,
    h
  );

  themeCtx.closePath();

  themeCtx.fill();


  /* dragon silhouette */

  const dx =
    w*.58;

  const dy =
    h*.42;

  themeCtx.fillStyle =
    "#010101";

  themeCtx.beginPath();

  themeCtx.ellipse(
    dx,
    dy,
    110,
    46,
    0,
    0,
    Math.PI*2
  );

  themeCtx.fill();


  /* wings */

  themeCtx.beginPath();

  themeCtx.moveTo(
    dx-45,
    dy-15
  );

  themeCtx.quadraticCurveTo(
    dx-170,
    dy-150,
    dx-15,
    dy-50
  );

  themeCtx.lineTo(
    dx-45,
    dy+20
  );

  themeCtx.fill();


  themeCtx.beginPath();

  themeCtx.moveTo(
    dx+45,
    dy-15
  );

  themeCtx.quadraticCurveTo(
    dx+170,
    dy-150,
    dx+15,
    dy-50
  );

  themeCtx.lineTo(
    dx+45,
    dy+20
  );

  themeCtx.fill();


  /* head */

  themeCtx.beginPath();

  themeCtx.arc(
    dx+105,
    dy-10,
    27,
    0,
    Math.PI*2
  );

  themeCtx.fill();


  /* tail */

  themeCtx.beginPath();

  themeCtx.moveTo(
    dx-90,
    dy+20
  );

  themeCtx.quadraticCurveTo(
    dx-230,
    dy+90+
      Math.sin(themeTime)*10,
    dx-180,
    dy+135
  );

  themeCtx.lineWidth=
    12;

  themeCtx.strokeStyle=
    "#010101";

  themeCtx.stroke();


  /* fire particles */

  objects.forEach(o=>{

    if(o.type!=="ember")
      return;

    o.y-=o.speed;

    o.x+=
      Math.sin(
        themeTime+
        o.y*.02
      )*.6;

    if(o.y<0){
      o.y=h;
      o.x=Math.random()*w;
    }

    themeCtx.fillStyle=
      `rgba(255,${80+Math.random()*100},20,.${Math.max(.2,o.alpha||.6)})`;

    themeCtx.beginPath();

    themeCtx.arc(
      o.x,
      o.y,
      o.size,
      0,
      Math.PI*2
    );

    themeCtx.fill();

  });

}


/* =========================================================
   DRAW GALAXY
========================================================= */

function drawGalaxy(){

  const w =
    window.innerWidth;

  const h =
    window.innerHeight;

  const cx =
    w/2;

  const cy =
    h/2;


  const gradient =
    themeCtx.createRadialGradient(
      cx,
      cy,
      10,
      cx,
      cy,
      Math.max(w,h)*.65
    );

  gradient.addColorStop(
    0,
    "#07000e"
  );

  gradient.addColorStop(
    .45,
    "#17003f"
  );

  gradient.addColorStop(
    .75,
    "#03000a"
  );

  gradient.addColorStop(
    1,
    "#000"
  );

  themeCtx.fillStyle =
    gradient;

  themeCtx.fillRect(
    0,
    0,
    w,
    h
  );


  /* nebula */

  const nebula =
    themeCtx.createRadialGradient(
      w*.3,
      h*.4,
      10,
      w*.3,
      h*.4,
      400
    );

  nebula.addColorStop(
    0,
    "rgba(150,70,255,.25)"
  );

  nebula.addColorStop(
    .4,
    "rgba(40,170,255,.11)"
  );

  nebula.addColorStop(
    1,
    "transparent"
  );

  themeCtx.fillStyle=
    nebula;

  themeCtx.fillRect(
    0,
    0,
    w,
    h
  );


  /* stars */

  objects.forEach(o=>{

    if(o.type!=="star")
      return;

    o.angle+=o.speed;

    const x =
      cx+
      Math.cos(o.angle)*
      o.radius;

    const y =
      cy+
      Math.sin(o.angle)*
      o.radius*
      .58;


    themeCtx.fillStyle =
      `rgba(200,235,255,${o.alpha})`;

    themeCtx.beginPath();

    themeCtx.arc(
      x,
      y,
      o.size,
      0,
      Math.PI*2
    );

    themeCtx.fill();

  });


  /* accretion ring */

  themeCtx.save();

  themeCtx.translate(
    cx,
    cy
  );

  themeCtx.rotate(
    -.22
  );

  themeCtx.strokeStyle =
    "rgba(255,150,55,.65)";

  themeCtx.lineWidth=14;

  themeCtx.beginPath();

  themeCtx.ellipse(
    0,
    0,
    185,
    52,
    0,
    0,
    Math.PI*2
  );

  themeCtx.stroke();


  themeCtx.strokeStyle =
    "rgba(120,80,255,.55)";

  themeCtx.lineWidth=8;

  themeCtx.beginPath();

  themeCtx.ellipse(
    0,
    0,
    230,
    68,
    0,
    0,
    Math.PI*2
  );

  themeCtx.stroke();

  themeCtx.restore();


  /* black hole */

  themeCtx.fillStyle="#000";

  themeCtx.beginPath();

  themeCtx.arc(
    cx,
    cy,
    86,
    0,
    Math.PI*2
  );

  themeCtx.fill();

}


/* =========================================================
   DRAW MOON
========================================================= */

function drawMoon(){

  const w =
    window.innerWidth;

  const h =
    window.innerHeight;


  const gradient =
    themeCtx.createLinearGradient(
      0,
      0,
      0,
      h
    );

  gradient.addColorStop(
    0,
    "#06133a"
  );

  gradient.addColorStop(
    1,
    "#02050d"
  );

  themeCtx.fillStyle=
    gradient;

  themeCtx.fillRect(
    0,
    0,
    w,
    h
  );


  /* stars */

  objects.forEach(o=>{

    if(
      o.type!=="moonStar"
    )
      return;

    const a =
      .3+
      .7*
      Math.abs(
        Math.sin(
          themeTime+
          o.phase
        )
      );

    themeCtx.fillStyle=
      `rgba(255,255,255,${a})`;

    themeCtx.beginPath();

    themeCtx.arc(
      o.x,
      o.y,
      o.size,
      0,
      Math.PI*2
    );

    themeCtx.fill();

  });


  /* moon */

  const mx =
    w*.73;

  const my =
    h*.22;

  const radius=100;


  themeCtx.shadowBlur=
    45;

  themeCtx.shadowColor=
    "rgba(230,240,255,.55)";

  themeCtx.fillStyle=
    "#eef4ff";

  themeCtx.beginPath();

  themeCtx.arc(
    mx,
    my,
    radius,
    0,
    Math.PI*2
  );

  themeCtx.fill();

  themeCtx.shadowBlur=0;


  /* moon shadow */

  themeCtx.fillStyle=
    "#06133a";

  themeCtx.beginPath();

  themeCtx.arc(
    mx+35,
    my-5,
    radius,
    0,
    Math.PI*2
  );

  themeCtx.fill();


  /* clouds */

  themeCtx.fillStyle=
    "rgba(255,255,255,.045)";

  for(
    let i=0;
    i<5;
    i++
  ){

    const x =
      ((themeTime*18+
        i*270)%
        (w+400))-200;

    themeCtx.beginPath();

    themeCtx.ellipse(
      x,
      h*.65+i*22,
      170,
      35,
      0,
      0,
      Math.PI*2
    );

    themeCtx.fill();

  }

}


/* =========================================================
   DRAW NIGHT CITY
========================================================= */

function drawNight(){

  const w =
    window.innerWidth;

  const h =
    window.innerHeight;


  const gradient=
    themeCtx.createLinearGradient(
      0,
      0,
      0,
      h
    );

  gradient.addColorStop(
    0,
    "#050a27"
  );

  gradient.addColorStop(
    1,
    "#010204"
  );

  themeCtx.fillStyle=
    gradient;

  themeCtx.fillRect(
    0,
    0,
    w,
    h
  );


  /* skyline */

  let x=0;

  while(
    x<w
  ){

    const bw =
      35+
      Math.random()*65;

    const bh =
      80+
      Math.random()*230;

    themeCtx.fillStyle=
      "#05080d";

    themeCtx.fillRect(
      x,
      h*.75-bh,
      bw,
      bh
    );

    x+=bw+8;

  }


  /* moving lights */

  objects.forEach(o=>{

    if(
      o.type!=="cityLight"
    )
      return;

    o.x+=o.speed;

    if(o.x>w)
      o.x=0;

    const glow =
      .4+
      .6*
      Math.abs(
        Math.sin(
          themeTime+
          o.x
        )
      );

    themeCtx.fillStyle=
      `rgba(255,218,105,${glow})`;

    themeCtx.shadowBlur=
      10;

    themeCtx.shadowColor=
      "#ffd86b";

    themeCtx.fillRect(
      o.x,
      o.y,
      o.size,
      o.size
    );

    themeCtx.shadowBlur=0;

  });

}


/* =========================================================
   DRAW DAY
========================================================= */

function drawDay(){

  const w =
    window.innerWidth;

  const h =
    window.innerHeight;


  const gradient=
    themeCtx.createLinearGradient(
      0,
      0,
      0,
      h
    );

  gradient.addColorStop(
    0,
    "#4ab8ef"
  );

  gradient.addColorStop(
    .6,
    "#ccefff"
  );

  gradient.addColorStop(
    1,
    "#3f9968"
  );

  themeCtx.fillStyle=
    gradient;

  themeCtx.fillRect(
    0,
    0,
    w,
    h
  );


  /* sun */

  themeCtx.shadowBlur=
    55;

  themeCtx.shadowColor=
    "#fff2a0";

  themeCtx.fillStyle=
    "#fff1a0";

  themeCtx.beginPath();

  themeCtx.arc(
    w*.75,
    h*.20,
    75,
    0,
    Math.PI*2
  );

  themeCtx.fill();

  themeCtx.shadowBlur=0;


  /* clouds */

  objects.forEach(o=>{

    if(
      o.type!=="cloud"
    )
      return;

    o.x+=o.speed;

    if(o.x>w+150)
      o.x=-150;

    themeCtx.fillStyle=
      "rgba(255,255,255,.65)";

    themeCtx.beginPath();

    themeCtx.arc(
      o.x,
      o.y,
      o.size,
      0,
      Math.PI*2
    );

    themeCtx.arc(
      o.x+o.size*.8,
      o.y+10,
      o.size*.72,
      0,
      Math.PI*2
    );

    themeCtx.arc(
      o.x-o.size*.7,
      o.y+12,
      o.size*.65,
      0,
      Math.PI*2
    );

    themeCtx.fill();

  });

}


/* =========================================================
   DRAW SNOW
========================================================= */

function drawSnow(){

  const w =
    window.innerWidth;

  const h =
    window.innerHeight;


  const gradient=
    themeCtx.createLinearGradient(
      0,
      0,
      0,
      h
    );

  gradient.addColorStop(
    0,
    "#79c8ea"
  );

  gradient.addColorStop(
    .6,
    "#edfaff"
  );

  gradient.addColorStop(
    1,
    "#a9c9db"
  );

  themeCtx.fillStyle=
    gradient;

  themeCtx.fillRect(
    0,
    0,
    w,
    h
  );


  /* mountains */

  themeCtx.fillStyle=
    "rgba(255,255,255,.72)";

  themeCtx.beginPath();

  themeCtx.moveTo(
    0,
    h*.72
  );

  themeCtx.lineTo(
    w*.18,
    h*.43
  );

  themeCtx.lineTo(
    w*.35,
    h*.72
  );

  themeCtx.lineTo(
    w*.55,
    h*.38
  );

  themeCtx.lineTo(
    w*.78,
    h*.72
  );

  themeCtx.lineTo(
    w,
    h*.45
  );

  themeCtx.lineTo(
    w,
    h
  );

  themeCtx.lineTo(
    0,
    h
  );

  themeCtx.closePath();

  themeCtx.fill();


  /* snow */

  objects.forEach(o=>{

    if(
      o.type!=="snow"
    )
      return;

    o.y+=o.speed;

    o.x+=
      Math.sin(
        themeTime+
        o.y*.01
      )*
      o.drift;

    if(o.y>h+10){

      o.y=-10;

      o.x=
        Math.random()*w;

    }

    themeCtx.fillStyle=
      "rgba(255,255,255,.9)";

    themeCtx.beginPath();

    themeCtx.arc(
      o.x,
      o.y,
      o.size,
      0,
      Math.PI*2
    );

    themeCtx.fill();

  });

}


/* =========================================================
   DRAW WALL
========================================================= */

function drawWall(){

  const w =
    window.innerWidth;

  const h =
    window.innerHeight;


  const shift =
    (themeTime*.025)%1;


  const gradient =
    themeCtx.createLinearGradient(
      0,
      0,
      w,
      h
    );


  gradient.addColorStop(
    0,
    `hsl(${(shift*360)%360},68%,58%)`
  );

  gradient.addColorStop(
    .25,
    `hsl(${((shift*360)+55)%360},55%,70%)`
  );

  gradient.addColorStop(
    .5,
    `hsl(${((shift*360)+120)%360},52%,68%)`
  );

  gradient.addColorStop(
    .75,
    `hsl(${((shift*360)+190)%360},60%,65%)`
  );

  gradient.addColorStop(
    1,
    `hsl(${((shift*360)+280)%360},65%,60%)`
  );

  themeCtx.fillStyle=
    gradient;

  themeCtx.fillRect(
    0,
    0,
    w,
    h
  );


  /* architectural panels */

  themeCtx.strokeStyle=
    "rgba(255,255,255,.18)";

  themeCtx.lineWidth=1;

  const size=100;

  for(
    let x=0;
    x<w;
    x+=size
  ){

    themeCtx.strokeRect(
      x,
      0,
      size,
      h
    );

  }


  for(
    let y=0;
    y<h;
    y+=size
  ){

    themeCtx.strokeRect(
      0,
      y,
      w,
      size
    );

  }

}


/* =========================================================
   RENDER LOOP
========================================================= */

function renderTheme(){

  themeTime+=.016;


  themeCtx.clearRect(
    0,
    0,
    window.innerWidth,
    window.innerHeight
  );


  if(activeTheme==="ocean")
    drawOcean();

  else if(activeTheme==="forest")
    drawForest();

  else if(activeTheme==="dragon")
    drawDragon();

  else if(activeTheme==="galaxy")
    drawGalaxy();

  else if(activeTheme==="moon")
    drawMoon();

  else if(activeTheme==="night")
    drawNight();

  else if(activeTheme==="day")
    drawDay();

  else if(activeTheme==="snow")
    drawSnow();

  else if(activeTheme==="wall")
    drawWall();


  animationId =
    requestAnimationFrame(
      renderTheme
    );

}


/* =========================================================
   START THEME
========================================================= */

function startLiveTheme(
  theme
){

  const data =
    themeData[theme];

  if(!data)
    return;


  activeTheme =
    theme;

  themeTime=0;


  themeIcon.textContent =
    data.icon;

  themeTitle.textContent =
    data.title;

  themeDescription.textContent =
    data.description;


  themeFlag.style.display =
    data.flag
    ? "block"
    : "none";


  createObjects(theme);


  /* show */

  themeWorld.classList.add(
    "active"
  );

  document.body.style.overflow =
    "hidden";


  /* restart */

  if(animationId){

    cancelAnimationFrame(
      animationId
    );

  }

  renderTheme();

}


/* =========================================================
   CLOSE THEME
========================================================= */

function closeLiveTheme(){

  themeWorld.classList.remove(
    "active"
  );

  document.body.style.overflow="";

  activeTheme="";


  if(animationId){

    cancelAnimationFrame(
      animationId
    );

    animationId=null;

  }


  themeCtx.clearRect(
    0,
    0,
    window.innerWidth,
    window.innerHeight
  );

}

</script>
